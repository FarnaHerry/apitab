name: build-and-package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  K6_VERSION: '1.5.0'

concurrency:
  group: build-and-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux 用 ubuntu:26.04 容器 + clang-21/libc++：
  #  - CMake 的 GNU import-std 发现是 4.0+ 才有的，且需要 GCC ≥15 的
  #    libstdc++.modules.json；25.10 的 3.31 不带（装 pip cmake 4.4.2 可解），
  #    但 GCC 15 对 vendored asio/json 模块包装器报 "exposes TU-local entity"
  #    （GCC 16 放宽了这条规则，26.04 的 g++-16 是 trunk 快照会 ICE）。
  #  - clang+libc++ 是本仓库的原始工具链形状（mcpp 时代也是 clang），26.04 的
  #    libc++-21-dev 自带 std 模块与 modules.json（Debian 打包的相对路径是坏的，
  #    需按 llvm-21 前缀改写为绝对路径，见下方步骤）。
  build-linux:
    name: build-linux-x86_64
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    steps:
      - name: Install container baseline
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch HuxerUI and SweetEdit sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/HuxerUI/HuxerUI.git third_party/huxerui
          git -C third_party/huxerui checkout 4d4bba82158123856ae78cf15b722143656eb7a6
          # 本地补丁（macOS ObjC++ 不实现 P0960 聚合函数式转换；见补丁内 NOTE）
          git -C third_party/huxerui apply ../../cmake/patches/huxerui-window-p0960.patch
          # 预置宿主工具可能与运行库的资源索引格式脱节；Linux CI 后面会用同一
          # 源码编译 hcg/hrc，补丁放开容器中不可用的 -static-libstdc++。
          git -C third_party/huxerui apply ../../cmake/patches/huxerui-hosttools-dynamic.patch
          git clone https://github.com/HuxerUI/huxerui-sweetedit.git third_party/huxerui-sweetedit
          git -C third_party/huxerui-sweetedit checkout d012eb78bf2707f57c36caff75b6f361f62b6de2
          # codeeditor 目标命名的新版（sweetedit_core 已在上游重命名成 codeeditor，
          # apitab CMakeLists 由此前的 TARGET sweetedit_core 改成了 codeeditor）。
          # 补丁即本地源码微调：SweetEditor 的 FetchContent 兜底、行号右对齐、
          # 分隔线读主题色、sweetline_provider 日志静音（均带 NOTE(apitab local patch)）。
          git -C third_party/huxerui-sweetedit apply ../../cmake/patches/huxerui-sweetedit-apitab.patch
          # SweetEditor/SweetLine 是 sweetedit 的 gitlink，但上游没有 .gitmodules，
          # 非递归 clone 拿不到内容；按 apitab 固定的 commit 显式 clone 并打本地
          # 防御性补丁（os_log 限 clang / wstring_convert 显式补 <locale>）。
          git clone https://github.com/FinalScave/SweetEditor.git third_party/huxerui-sweetedit/3dparty/SweetEditor
          git -C third_party/huxerui-sweetedit/3dparty/SweetEditor checkout bd4330e70eda5c71b71ecac54cf7312d82d2eae2
          git -C third_party/huxerui-sweetedit/3dparty/SweetEditor apply ../../../../cmake/patches/sweeteditor-oslog-gcc.patch
          git clone https://github.com/FinalScave/SweetLine.git third_party/huxerui-sweetedit/3dparty/SweetLine
          git -C third_party/huxerui-sweetedit/3dparty/SweetLine checkout 64665d94c8421372cbdce0f74daeb7b8a414d422
          git -C third_party/huxerui-sweetedit/3dparty/SweetLine apply ../../../../cmake/patches/sweetline-locale-include.patch

      - name: Install dependencies
        run: |
          apt-get install -y --no-install-recommends \
            clang-21 libc++-21-dev g++ ninja-build pkg-config file python3 python3-pip \
            libssl-dev libgtk-4-dev libepoxy-dev libsoup-3.0-dev patchelf
          # 26.04 的 apt cmake 是 3.31（无 GNU 发现模块且全局 token 不匹配），固定 pip 4.4.2
          python3 -m pip install --break-system-packages -q cmake==4.4.2
          cmake --version | head -1
          # Debian 打包的 libc++.modules.json 相对路径坏指 /lib/share/...，
          # 按 /usr/lib/llvm-21 的真实布局改写为绝对路径
          python3 -c "
          import json
          p = '/usr/lib/x86_64-linux-gnu/libc++.modules.json'
          d = json.load(open(p))
          for m in d['modules']:
              m['source-path'] = '/usr/lib/llvm-21/share/libc++/v1/' + m['source-path'].split('/')[-1]
              m['local-arguments']['system-include-directories'] = ['/usr/lib/llvm-21/share/libc++/v1']
          json.dump(d, open(p, 'w'), indent=1)"

      - name: Build HuxerUI host tools (source)
        run: |
          set -euo pipefail
          tools_root="third_party/huxerui-tools/linux/x86_64"
          mkdir -p "$tools_root"
          for tool in codegen resource_compiler; do
            build_dir="host-tools-build/$tool"
            cmake -S "third_party/huxerui/tools/$tool" -B "$build_dir" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DAPITAB_HOST_TOOLS_DYNAMIC=ON
            cmake --build "$build_dir" --config Release --parallel
            cmake --install "$build_dir" --config Release --strip --prefix "$tools_root"
          done
          test -x "$tools_root/hcg"
          test -x "$tools_root/hrc"

      - name: Build and install HuxerUI SDK (source)
        run: |
          set -euo pipefail
          sdk_prefix="$PWD/huxerui-sdk"
          cmake -S third_party/huxerui -B huxerui-sdk-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$sdk_prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++' \
            -DCMAKE_EXE_LINKER_FLAGS='-stdlib=libc++' \
            -DCMAKE_SHARED_LINKER_FLAGS='-stdlib=libc++' \
            -DHUXERUI_BUILD_SHARED=ON \
            -DHUXERUI_BUILD_STATIC=OFF \
            -DHUXERUI_BUILD_CLI=ON \
            -DHUXERUI_BUILD_EXAMPLES=OFF \
            -DHUXERUI_BUILD_TESTS=OFF \
            -DHUXERUI_HOST_TOOL_ROOT="$PWD/third_party/huxerui-tools"
          cmake --build huxerui-sdk-build --config Release --parallel
          cmake --install huxerui-sdk-build --config Release --strip
          sdk_tools="$sdk_prefix/share/huxerui/tools/linux/x86_64"
          install -d "$sdk_tools"
          install -m 755 third_party/huxerui-tools/linux/x86_64/hcg "$sdk_tools/hcg"
          install -m 755 third_party/huxerui-tools/linux/x86_64/hrc "$sdk_tools/hrc"
          test -f "$sdk_prefix/lib/cmake/HuxerUI/HuxerUIConfig.cmake"
          test -f "$sdk_prefix/lib/libhuxerui.so"
          echo "HUXERUI_HOME=$sdk_prefix" >> "$GITHUB_ENV"
          echo "$sdk_prefix/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          # SweetEditor 自带的 linux 预置 libsimdutf.a 是 g++/libstdc++ 编译的，
          # 其并入 sweeteditor_static 的对象引用 GLIBCXX 版本化 glue 符号
          # (std::ios_base_library_init)；libc++ 主链接需显式补该 DSO。
          # 仅一个初始化 glue 符号，无 std:: 类型跨界，安全；标准库变量放
          # 链接行对象之后保证解析顺序。clang/Dev 本机 GCC 通道不需要。
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++' \
            -DCMAKE_EXE_LINKER_FLAGS='-stdlib=libc++' \
            -DCMAKE_SHARED_LINKER_FLAGS='-stdlib=libc++' \
            -DCMAKE_CXX_STANDARD_LIBRARIES=/usr/lib/x86_64-linux-gnu/libstdc++.so.6 \
            -DHUXERUI_HOME="$HUXERUI_HOME" \
            -DAPITAB_HUXERUI_FORCE_SDK=ON

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Stage runtime bundle
        run: |
          set -euo pipefail
          mkdir -p dist-src/lib
          cp build/apitab dist-src/apitab
          chmod +x dist-src/apitab
          # SDK 模式的 libhuxerui.so 来自本 CI 同源码编译的 SDK，发布包必须
          # 随 exe 带出，并让动态加载器按 $ORIGIN/lib 解析。
          test -f "$HUXERUI_HOME/lib/libhuxerui.so" || {
            echo 'installed HuxerUI SDK library not found' >&2
            exit 1
          }
          cp -L "$HUXERUI_HOME/lib/libhuxerui.so" dist-src/lib/libhuxerui.so
          # apitab 用 clang + libc++ 编译/链接；libc++/libc++abi 大多数发行版
          # 不会预装（Fedora/Debian 默认只带 libstdc++），同样随包带出。
          for lib in libc++.so.1 libc++abi.so.1 libunwind.so.1; do
            p="$(find /usr/lib -name "$lib" -print -quit 2>/dev/null || true)"
            if [ -n "$p" ]; then cp -L "$p" "dist-src/lib/$lib"; fi
          done
          # 框架资源包：运行时除了 resources.bin 索引，还会读取同包内的
          # .huxv/.png 等 payload；必须完整复制整个资源目录，不能只带索引。
          cp -a build/apitab.resources dist-src/
          # 覆盖构建期指向 CI 工作区的 RUNPATH，改为相对 $ORIGIN
          patchelf --set-rpath '$ORIGIN/lib' dist-src/apitab
          file dist-src/apitab
          ls -la dist-src/lib

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-x86_64
          path: dist-src
          if-no-files-found: error
          retention-days: 14

  build-other:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            binary: build/apitab.exe
          - name: macos-arm64
            os: macos-15
            # huxerui_add_app 在 APPLE 上产 .app bundle，可执行在 Contents/MacOS 下
            binary: build/apitab.app/Contents/MacOS/apitab

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch HuxerUI and SweetEdit sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/HuxerUI/HuxerUI.git third_party/huxerui
          git -C third_party/huxerui checkout 4d4bba82158123856ae78cf15b722143656eb7a6
          # 本地补丁（macOS ObjC++ 不实现 P0960 聚合函数式转换；见补丁内 NOTE）
          git -C third_party/huxerui apply ../../cmake/patches/huxerui-window-p0960.patch
          git clone https://github.com/HuxerUI/huxerui-sweetedit.git third_party/huxerui-sweetedit
          git -C third_party/huxerui-sweetedit checkout d012eb78bf2707f57c36caff75b6f361f62b6de2
          # codeeditor 目标命名的新版（sweetedit_core 已在上游重命名成 codeeditor，
          # apitab CMakeLists 由此前的 TARGET sweetedit_core 改成了 codeeditor）。
          # 补丁即本地源码微调：SweetEditor 的 FetchContent 兜底、行号右对齐、
          # 分隔线读主题色、sweetline_provider 日志静音（均带 NOTE(apitab local patch)）。
          git -C third_party/huxerui-sweetedit apply ../../cmake/patches/huxerui-sweetedit-apitab.patch
          # SweetEditor/SweetLine 是 sweetedit 的 gitlink，但上游没有 .gitmodules，
          # 非递归 clone 拿不到内容；按 apitab 固定的 commit 显式 clone 并打本地
          # 防御性补丁（os_log 限 clang / wstring_convert 显式补 <locale>）。
          git clone https://github.com/FinalScave/SweetEditor.git third_party/huxerui-sweetedit/3dparty/SweetEditor
          git -C third_party/huxerui-sweetedit/3dparty/SweetEditor checkout bd4330e70eda5c71b71ecac54cf7312d82d2eae2
          git -C third_party/huxerui-sweetedit/3dparty/SweetEditor apply ../../../../cmake/patches/sweeteditor-oslog-gcc.patch
          git clone https://github.com/FinalScave/SweetLine.git third_party/huxerui-sweetedit/3dparty/SweetLine
          git -C third_party/huxerui-sweetedit/3dparty/SweetLine checkout 64665d94c8421372cbdce0f74daeb7b8a414d422
          git -C third_party/huxerui-sweetedit/3dparty/SweetLine apply ../../../../cmake/patches/sweetline-locale-include.patch

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 &>/dev/null || brew install openssl@3
          # C/C++/OBJCXX 整链走 brew LLVM clang/libc++。.mm 框架层只能由 clang
          # 编译（ARC/blocks），而 std 类型（std::string/string_view/shared_ptr）
          # 贯穿 .mm 与 .cpp 的接口——单进程必须单一标准库：brew GCC/libstdc++
          # 与 AppleClang/libc++ 混链在 mangling 层就分叉（libstdc++ 的 __cxx11
          # ABI tag / std:: 对 libc++ 的 std::__1），File::Path、
          # PlatformRegistry::FindViewValue 链接期 undefined symbol 实证；即便
          # 强链过，std 容器布局不一致也是堆 UB。AppleClang 本体也不行：CMake
          # 不支持其 C++20 模块扫描，apitab 的 .cppm/FILE_SET 过不了 generate。
          brew install llvm
          llvm_prefix="$(brew --prefix llvm)"
          mod_dir="$llvm_prefix/share/libc++/v1"
          # import std 还需 std 模块元数据。brew llvm 只装模块源
          # （LIBCXX_INSTALL_MODULES=ON → share/libc++/v1），不带
          # libc++.modules.json（formula 未开 LIBCXX_ENABLE_STD_MODULES）——
          # 按上游 schema 生成一份：绝对 source-path，模块源目录作
          # system-include（std.cppm include 的头路径由 clang 驱动默认提供）。
          # 顺手写进 brew 的 lib/：-print-file-name 发现路径也能命中。
          for f in std.cppm std.compat.cppm; do
            test -f "$mod_dir/$f" || { echo "missing $mod_dir/$f (brew llvm layout changed?)" >&2; exit 1; }
          done
          python3 - "$mod_dir" "$llvm_prefix/lib/libc++.modules.json" <<'PY'
          import json, sys
          mod_dir, out = sys.argv[1], sys.argv[2]
          mod = lambda name: {"logical-name": name, "source-path": mod_dir + "/" + name + ".cppm", "is-std-library": True, "local-arguments": {"system-include-directories": [mod_dir]}}
          json.dump({"version": 1, "revision": 1, "modules": [mod("std"), mod("std.compat")]}, open(out, "w"), indent=1)
          PY
          echo "APITAB_LLVM_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          cmake --version
          ninja --version

      - name: Build and install HuxerUI SDK (macOS source)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sdk_prefix="$PWD/huxerui-sdk"
          cmake -S third_party/huxerui -B huxerui-sdk-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$sdk_prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_CXX_COMPILER="$APITAB_LLVM_PREFIX/bin/clang++" \
            -DCMAKE_OBJCXX_COMPILER="$APITAB_LLVM_PREFIX/bin/clang++" \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++ -D_LIBCPP_DISABLE_AVAILABILITY' \
            -DCMAKE_OBJCXX_FLAGS='-stdlib=libc++ -D_LIBCPP_DISABLE_AVAILABILITY' \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -L$APITAB_LLVM_PREFIX/lib/c++ -L$APITAB_LLVM_PREFIX/lib/unwind -lc++ -lc++abi -lunwind" \
            -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++ -L$APITAB_LLVM_PREFIX/lib/c++ -L$APITAB_LLVM_PREFIX/lib/unwind -lc++ -lc++abi -lunwind" \
            -DHUXERUI_BUILD_SHARED=ON \
            -DHUXERUI_BUILD_STATIC=OFF \
            -DHUXERUI_BUILD_CLI=OFF \
            -DHUXERUI_BUILD_EXAMPLES=OFF \
            -DHUXERUI_BUILD_TESTS=OFF \
            -DHUXERUI_HOST_TOOL_ROOT="$PWD/third_party/huxerui/tools/prebuilt"
          cmake --build huxerui-sdk-build --config Release --parallel
          cmake --install huxerui-sdk-build --config Release --strip
          test -f "$sdk_prefix/lib/cmake/HuxerUI/HuxerUIConfig.cmake"
          test -f "$sdk_prefix/lib/libhuxerui.dylib"
          echo "HUXERUI_HOME=$sdk_prefix" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install openssl -y --no-progress
          Write-Host "OPENSSL_ROOT_DIR=C:/Program Files/OpenSSL" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # C/C++/OBJCXX 全部落 brew llvm clang（单一标准库的必要性见安装步骤
          # 注释；OBJCXX 必须显式指定，否则 CMake 默认会拿 xcrun 的 AppleClang
          # 又混回两套 libc++ 头/库）。-stdlib=libc++ 写进 CXX/OBJCXX 与链接
          # flags：一是确定性链接 brew 的 libc++ 而非 SDK 里的 Apple 版，二是
          # 让 CMake 把标准库识别为 libc++ 走 import std 消费路径——
          # CMAKE_CXX_STDLIB_MODULES_JSON 直接指向上一步生成的元数据，绕过
          # -print-file-name 发现（brew llvm 没有该 json，显式注入最稳）。
          # _LIBCPP_DISABLE_AVAILABILITY：头文件的可用性标注（如浮点
          # from_chars 标 macOS 26.0）是给 Apple 系统 dylib 的；本链链的是
          # brew 自带 dylib（符号齐全），标注全是假约束——libc++ 文档认可的
          # 关闭方式。CMAKE_CXX_FLAGS 会进 std 模块 BMI 编译，宏全程一致。
          # 链接行必须按 brew llvm formula 的 caveats 配方来：brew 的 libc++/
          # libc++abi dylib 装在 lib/c++（不是 lib/），libunwind 在 lib/unwind
          # ——-L 不指对目录时 -lc++ 会落到 SDK 的系统 libc++ tbd（版本老、
          # ABI inline namespace 对不上，__hash_memory/
          # __bad_variant_access_with_msg 等 undefined 实证）。caveats 同时
          # 明确：要用比系统 libc++ 新的特性就加 -D_LIBCPP_DISABLE_AVAILABILITY
          # （见上方 CXX flags）——与本通道的用法完全一致。
          # brew libc++ 23 的 std::jthread/stop_token 已转正，Apple libc++ 的
          # -fexperimental-library 不再需要。
          # 部署目标 14.0：框架自身已使用 macOS 14 API（CADisplayLink）。
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$APITAB_LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$APITAB_LLVM_PREFIX/bin/clang++" \
            -DCMAKE_OBJCXX_COMPILER="$APITAB_LLVM_PREFIX/bin/clang++" \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++ -D_LIBCPP_DISABLE_AVAILABILITY' \
            -DCMAKE_OBJCXX_FLAGS='-stdlib=libc++ -D_LIBCPP_DISABLE_AVAILABILITY' \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -L$APITAB_LLVM_PREFIX/lib/c++ -L$APITAB_LLVM_PREFIX/lib/unwind -lc++ -lc++abi -lunwind" \
            -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++ -L$APITAB_LLVM_PREFIX/lib/c++ -L$APITAB_LLVM_PREFIX/lib/unwind -lc++ -lc++abi -lunwind" \
            -DCMAKE_MODULE_LINKER_FLAGS="-stdlib=libc++ -L$APITAB_LLVM_PREFIX/lib/c++ -L$APITAB_LLVM_PREFIX/lib/unwind -lc++ -lc++abi -lunwind" \
            -DCMAKE_CXX_STDLIB_MODULES_JSON="$APITAB_LLVM_PREFIX/lib/libc++.modules.json" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3 \
            -DHUXERUI_HOME="$HUXERUI_HOME" \
            -DAPITAB_HUXERUI_FORCE_SDK=ON

      - name: Build and install HuxerUI SDK (Windows source)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkPrefix = Join-Path $PWD 'huxerui-sdk'
          cmake -S third_party/huxerui -B huxerui-sdk-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_INSTALL_PREFIX=$sdkPrefix" `
            -DCMAKE_INSTALL_LIBDIR=lib `
            -DHUXERUI_BUILD_SHARED=ON `
            -DHUXERUI_BUILD_STATIC=OFF `
            -DHUXERUI_BUILD_CLI=OFF `
            -DHUXERUI_BUILD_EXAMPLES=OFF `
            -DHUXERUI_BUILD_TESTS=OFF `
            "-DHUXERUI_HOST_TOOL_ROOT=$PWD/third_party/huxerui/tools/prebuilt"
          cmake --build huxerui-sdk-build --config Release --parallel
          cmake --install huxerui-sdk-build --config Release --strip
          if (-not (Test-Path (Join-Path $sdkPrefix 'lib/cmake/HuxerUI/HuxerUIConfig.cmake'))) { throw 'HuxerUI SDK CMake package not installed' }
          "HUXERUI_HOME=$sdkPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          if (-not (Test-Path (Join-Path $sdkPrefix 'bin/huxerui.dll'))) { throw 'HuxerUI SDK DLL not installed' }

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR" `
            "-DHUXERUI_HOME=$env:HUXERUI_HOME" -DAPITAB_HUXERUI_FORCE_SDK=ON

      - name: Build release
        run: cmake --build build --config Release --parallel

      - name: Stage executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = '${{ matrix.binary }}'
          if (-not (Test-Path $candidate)) { throw "$candidate not found" }
          New-Item -ItemType Directory -Force dist-src | Out-Null
          $candidatePath = (Resolve-Path $candidate).Path
          $candidateDirectory = Split-Path -Parent $candidatePath
          $artifactName = Split-Path -Leaf $candidate
          Copy-Item $candidatePath (Join-Path $PWD "dist-src\$artifactName")

          if ('${{ runner.os }}' -eq 'Windows') {
            # HuxerUI and its Windows runtime dependencies are emitted in
            # different subdirectories of the build tree. The executable alone
            # is not a runnable artifact, so flatten every generated DLL next
            # to apitab.exe.
            $runtimeDlls = @(Get-ChildItem -Path build -Recurse -File -Filter '*.dll')
            if ($runtimeDlls.Count -eq 0) {
              throw 'No Windows runtime DLLs were produced under build'
            }
            foreach ($runtimeDll in $runtimeDlls) {
              Copy-Item $runtimeDll.FullName (Join-Path $PWD "dist-src\$($runtimeDll.Name)") -Force
            }

            # The HuxerUI resource package is also required at runtime and is
            # generated beside the executable by the app post-build step.
            $resources = Join-Path $candidateDirectory 'apitab.resources'
            if (-not (Test-Path $resources -PathType Container)) {
              throw "$resources not found"
            }
            Copy-Item $resources (Join-Path $PWD 'dist-src\apitab.resources') -Recurse -Force
          }
          Get-Item dist-src/*

      - name: Check source whitespace
        # 只在非容器 job（macos）上做：容器 job 里 checkout 在宿主机跑、run 在
        # 容器里跑，容器内的 git 看不到宿主机建立的仓库。
        if: runner.os == 'macOS'
        run: git diff --check

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: dist-src
          if-no-files-found: error
          retention-days: 14

  package:
    name: package-${{ matrix.name }}
    needs: [build-linux, build-other]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            k6_asset: k6-v1.5.0-linux-amd64.tar.gz
            k6_binary: k6
            package_script: unix
          - name: windows-x86_64
            os: windows-latest
            k6_asset: k6-v1.5.0-windows-amd64.zip
            k6_binary: k6.exe
            package_script: windows
          - name: macos-arm64
            os: macos-15
            k6_asset: k6-v1.5.0-macos-arm64.zip
            k6_binary: k6
            package_script: unix

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download built executable
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: dist-src

      - name: Install Unix tools
        if: runner.os != 'Windows'
        run: |
          if [[ "${{ runner.os }}" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates file unzip
          fi

      - name: Download k6 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engines k6-tmp
          archive="${{ matrix.k6_asset }}"
          curl -fL --retry 3 -o "k6-tmp/$archive" "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/$archive"
          curl -fL --retry 3 -o k6-tmp/checksums.txt "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-checksums.txt"
          expected="$(awk -v name="$archive" '$2 == name { print $1; exit }' k6-tmp/checksums.txt)"
          [[ -n "$expected" ]] || { echo "checksum entry missing for $archive" >&2; exit 1; }
          # macOS 没有 sha256sum，用自带的 shasum
          if command -v sha256sum >/dev/null; then
            actual="$(sha256sum "k6-tmp/$archive" | cut -d' ' -f1)"
          else
            actual="$(shasum -a 256 "k6-tmp/$archive" | awk '{print $1}')"
          fi
          [[ "$actual" == "$expected" ]] || { echo "checksum mismatch for $archive" >&2; exit 1; }
          if [[ "$archive" == *.zip ]]; then
            unzip -q "k6-tmp/$archive" -d k6-tmp
          else
            tar -xzf "k6-tmp/$archive" -C k6-tmp
          fi
          found="$(find k6-tmp -type f -name k6 | head -n1)"
          [[ -n "$found" ]] || { echo 'k6 binary not found in archive' >&2; exit 1; }
          cp "$found" engines/k6
          chmod +x engines/k6
          engines/k6 version

      - name: Download k6 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force engines, k6-tmp | Out-Null
          $archive = '${{ matrix.k6_asset }}'
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          curl.exe -fL --retry 3 -o $archivePath "https://github.com/grafana/k6/releases/download/v$env:K6_VERSION/$archive"
          $checksumPath = Join-Path $env:RUNNER_TEMP "k6-v$env:K6_VERSION-checksums.txt"
          curl.exe -fL --retry 3 -o $checksumPath "https://github.com/grafana/k6/releases/download/v$env:K6_VERSION/k6-v$env:K6_VERSION-checksums.txt"
          $expected = (Get-Content $checksumPath | Where-Object { $_ -match "\s$([regex]::Escape($archive))$" } | Select-Object -First 1) -replace '^\s*([^\s]+).*', '$1'
          if (-not $expected) { throw "checksum entry missing for $archive" }
          $actual = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected.ToLowerInvariant()) { throw "checksum mismatch for $archive" }
          Expand-Archive -Path $archivePath -DestinationPath k6-tmp -Force
          $found = Get-ChildItem k6-tmp -Filter k6.exe -File -Recurse | Select-Object -First 1
          if (-not $found) { throw 'k6.exe not found in archive' }
          Copy-Item $found.FullName engines\k6.exe
          & engines\k6.exe version

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: bash packaging/ci-package.sh "${{ matrix.name == 'linux-x86_64' && 'linux' || 'macos' }}" "${{ matrix.name == 'linux-x86_64' && 'x86_64' || 'arm64' }}" dist-src/apitab engines/k6

      - name: Package Linux deb/rpm
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          version="$(grep -m1 -E '^project\(apitab +VERSION ' CMakeLists.txt | sed -E 's/.*VERSION +([0-9.]+).*/\1/')"
          bash packaging/ci-package-deb.sh "$version" x86_64 dist
          bash packaging/ci-package-rpm.sh "$version" x86_64 dist

      - name: Install full NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis -y --no-progress
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) { throw 'NSIS install failed' }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & packaging\ci-package.ps1 dist-src\apitab.exe engines\k6.exe
          $line = Get-Content CMakeLists.txt | Where-Object { $_ -match '^\s*project\(apitab\s+VERSION\s+' } | Select-Object -First 1
          $version = $line -replace '^\s*project\(apitab\s+VERSION\s+([0-9.]+).*', '$1'
          makensis "/DAPP_VERSION=$version" "$env:GITHUB_WORKSPACE\packaging\apitab.nsi"
          Get-ChildItem "apitab-v$version-windows-x86_64*"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: |
            apitab-v*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: apitab ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: artifacts/*
